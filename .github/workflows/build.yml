name: Cross-platform build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and run headless demos
        shell: bash
        run: ./gradlew build :engine:run :render-system:run
      - name: Upload CPU world preview
        uses: actions/upload-artifact@v4
        with:
          name: cpu-world-${{ matrix.os }}
          path: render-system/build/demo/voxel-world.png
          if-no-files-found: error
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Validate native lifecycle and pixel presentation
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew :render-system:nativeSmoke
      - name: Upload OpenGL readback
        uses: actions/upload-artifact@v4
        with:
          name: opengl-world-linux
          path: render-system/build/demo/opengl-world.png
          if-no-files-found: error
